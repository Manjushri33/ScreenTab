<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Alt+Tab shows windows on the active monitor</title>
  <desc id="desc">Two monitors contain separate windows. ScreenTab keeps the native Alt+Tab interface and lists only windows from the active left monitor.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <linearGradient id="active" x2="1" y2="1">
      <stop stop-color="#4f9bff"/>
      <stop offset="1" stop-color="#8dd8ff"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" rx="22" fill="url(#background)"/>
  <text x="58" y="54" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Keep your focus on one screen</text>
  <text x="58" y="82" fill="#b7c7dd" font-family="Segoe UI, Arial, sans-serif" font-size="16">ScreenTab filters the native Windows Alt+Tab list to the active monitor.</text>

  <text x="65" y="126" fill="#9ec9ff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">ACTIVE MONITOR</text>
  <text x="524" y="126" fill="#9eaec3" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">OTHER MONITOR</text>
  <rect x="57" y="141" width="405" height="159" rx="11" fill="#21344e" stroke="#68b4ff" stroke-width="3"/>
  <rect x="515" y="141" width="405" height="159" rx="11" fill="#1b2a40" stroke="#54708f" stroke-width="2"/>
  <path d="M224 301h70l8 12h-86zM683 301h70l8 12h-86z" fill="#455d79"/>

  <rect x="77" y="162" width="170" height="111" rx="9" fill="#345073"/>
  <rect x="77" y="162" width="170" height="22" rx="9" fill="#4975ad"/>
  <text x="95" y="178" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="13">Browser</text>
  <rect x="268" y="162" width="171" height="111" rx="9" fill="#345073"/>
  <rect x="268" y="162" width="171" height="22" rx="9" fill="#4975ad"/>
  <text x="286" y="178" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="13">Editor</text>

  <rect x="535" y="162" width="170" height="111" rx="9" fill="#304054"/>
  <rect x="535" y="162" width="170" height="22" rx="9" fill="#455b75"/>
  <text x="553" y="178" fill="#d3dfed" font-family="Segoe UI, Arial, sans-serif" font-size="13">Mail</text>
  <rect x="726" y="162" width="171" height="111" rx="9" fill="#304054"/>
  <rect x="726" y="162" width="171" height="22" rx="9" fill="#455b75"/>
  <text x="744" y="178" fill="#d3dfed" font-family="Segoe UI, Arial, sans-serif" font-size="13">Files</text>

  <path d="M258 323v18" stroke="#83beff" stroke-width="3" stroke-linecap="round"/>
  <path d="m250 335 8 8 8-8" fill="none" stroke="#83beff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="58" y="350" width="404" height="49" rx="12" fill="#254566" stroke="#65afff"/>
  <rect x="72" y="359" width="88" height="31" rx="7" fill="url(#active)"/>
  <text x="84" y="380" fill="#10243d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Alt + Tab</text>
  <text x="176" y="380" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Browser</text>
  <text x="276" y="380" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Editor</text>
  <text x="525" y="380" fill="#b7c7dd" font-family="Segoe UI, Arial, sans-serif" font-size="15">Mail and Files stay on the other screen</text>
</svg>
