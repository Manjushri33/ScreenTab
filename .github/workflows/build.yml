name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        shell: powershell
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate Windows icon
        shell: powershell
        run: python scripts/make_icon.py

      - name: Run contract tests
        shell: powershell
        run: python -m unittest discover -s tests -v

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Create portable package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\ScreenTab | Out-Null
          Copy-Item build\Release\ScreenTab.exe dist\ScreenTab\ScreenTab.exe
          Copy-Item build\Release\ScreenTabHook.dll dist\ScreenTab\ScreenTabHook.dll
          Compress-Archive -Path dist\ScreenTab\* -DestinationPath dist\ScreenTab-windows-x64.zip -Force
          $hash = (Get-FileHash dist\ScreenTab-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ScreenTab-windows-x64.zip" | Set-Content dist\ScreenTab-windows-x64.zip.sha256 -Encoding ascii

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ScreenTab.iss'

      - name: Create installer SHA-256 checksum
        shell: powershell
        run: |
          $file = "installer\Output\ScreenTab-Setup.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  ScreenTab-Setup.exe" | Set-Content "installer\Output\ScreenTab-Setup.exe.sha256" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTab-windows-x64
          path: |
            build/Release/ScreenTab.exe
            build/Release/ScreenTabHook.dll
            dist/ScreenTab-windows-x64.zip
            dist/ScreenTab-windows-x64.zip.sha256
            installer/Output/ScreenTab-Setup.exe
            installer/Output/ScreenTab-Setup.exe.sha256

      - name: Publish GitHub Release
        if: "startsWith(github.ref, 'refs/tags/v') || github.event.head_commit.message == 'release: v0.1.0'"
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v0.1.0"
          }
          gh release create $tag `
            "dist/ScreenTab-windows-x64.zip" `
            "dist/ScreenTab-windows-x64.zip.sha256" `
            "installer/Output/ScreenTab-Setup.exe" `
            "installer/Output/ScreenTab-Setup.exe.sha256" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "ScreenTab $tag" `
            --generate-notes
