name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        shell: powershell
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate Windows icon
        shell: powershell
        run: python scripts/make_icon.py

      - name: Run contract tests
        shell: powershell
        run: python -m unittest discover -s tests -v

      - name: Fetch Microsoft symbol runtime
        shell: powershell
        run: .\scripts\fetch_symbol_runtime.ps1

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Run native hook tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Create portable package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist\ScreenTab | Out-Null
          Copy-Item build\Release\ScreenTab.exe dist\ScreenTab\ScreenTab.exe
          Copy-Item build\Release\ScreenTabHook.dll dist\ScreenTab\ScreenTabHook.dll
          Copy-Item build\Release\dbghelp.dll dist\ScreenTab\dbghelp.dll
          Copy-Item build\Release\symsrv.dll dist\ScreenTab\symsrv.dll
          Copy-Item build\Release\msdia140.dll dist\ScreenTab\msdia140.dll
          Copy-Item THIRD_PARTY_NOTICES.md dist\ScreenTab\THIRD_PARTY_NOTICES.md
          Compress-Archive -Path dist\ScreenTab\* -DestinationPath dist\ScreenTab-windows-x64.zip -Force
          $hash = (Get-FileHash dist\ScreenTab-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ScreenTab-windows-x64.zip" | Set-Content dist\ScreenTab-windows-x64.zip.sha256 -Encoding ascii

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ScreenTab.iss'

      - name: Test installer update interface
        shell: powershell
        run: python scripts/test_installer.py --iscc "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Create installer SHA-256 checksum
        shell: powershell
        run: |
          $file = "installer\Output\ScreenTab-Setup.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  ScreenTab-Setup.exe" | Set-Content "installer\Output\ScreenTab-Setup.exe.sha256" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTab-windows-x64
          path: |
            build/Release/ScreenTab.exe
            build/Release/ScreenTabHook.dll
            build/Release/dbghelp.dll
            build/Release/symsrv.dll
            build/Release/msdia140.dll
            dist/ScreenTab-windows-x64.zip
            dist/ScreenTab-windows-x64.zip.sha256
            installer/Output/ScreenTab-Setup.exe
            installer/Output/ScreenTab-Setup.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/ScreenTab-windows-x64.zip" `
            "dist/ScreenTab-windows-x64.zip.sha256" `
            "installer/Output/ScreenTab-Setup.exe" `
            "installer/Output/ScreenTab-Setup.exe.sha256" `
            --repo "${{ github.repository }}" `
            --title "ScreenTab ${{ github.ref_name }}" `
            --generate-notes
